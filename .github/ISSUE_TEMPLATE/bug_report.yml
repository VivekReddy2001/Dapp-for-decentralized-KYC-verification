name: Bug report
description: Something in the DApp does not behave as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please check [SECURITY.md](../blob/main/SECURITY.md) first — the known security
        weaknesses are documented there with their fixes, and are not bugs to re-report.
        For a new security issue, open a private advisory instead of an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm run chain
        2. npm run deploy
        3. Register a bank as ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where?
      options:
        - Smart contract
        - Bank portal
        - Customer portal
        - Build / deploy scripts
        - Documentation
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v20.11.0
  - type: textarea
    id: console
    attributes:
      label: Browser console output
      render: shell
