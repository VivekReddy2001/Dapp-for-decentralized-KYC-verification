name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: input
    id: finding
    attributes:
      label: Does this relate to a finding in SECURITY.md?
      placeholder: "e.g. finding 3 — consent enforced in the wrong layer"
